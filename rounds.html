<script>
// Round timers: a countdown on slides with class "round" and data-timer="3" (minutes).
// The timer waits at full time until the button is pressed, so there is time to swap
// actors and cards. The button starts the timer; while it runs (or once time is up)
// the same button resets it, stopped at full time, ready to start again.
// Double-click the time to change how long the round lasts (e.g. 2, 2:30 or 90s):
// Enter or clicking away saves, Escape cancels. A change applies to that round only
// and is saved in the browser.
(function () {
  const pad = n => String(n).padStart(2, "0");
  const fmt = ms => { const t = Math.ceil(ms / 1000); return Math.floor(t / 60) + ":" + pad(t % 60); };
  // "3" or "2.5" is minutes, "2:30" is minutes and seconds, "90s" is seconds
  function parse(text) {
    const t = text.trim().toLowerCase();
    let m;
    if ((m = t.match(/^(\d{1,3}):([0-5]\d)$/))) return (+m[1] * 60 + +m[2]) * 1000;
    if ((m = t.match(/^(\d{1,4})\s*s$/))) return +m[1] * 1000;
    if ((m = t.match(/^(\d{1,3}(?:\.\d+)?)\s*m?$/))) return Math.round(+m[1] * 60) * 1000;
    return null;
  }
  const key = r => "charades-timer|" + location.pathname + "|" + r.s.id;
  function load(r) {
    try { const v = +localStorage.getItem(key(r)); return v > 0 ? v : null; } catch (e) { return null; }
  }
  function save(r) {
    try { localStorage.setItem(key(r), String(r.duration)); } catch (e) { /* storage blocked: lasts until reload */ }
  }

  const rounds = [...document.querySelectorAll(".reveal .slides section.round")].map(s => {
    const r = { s, end: null, input: null };
    r.planned = (parseFloat(s.dataset.timer) || 3) * 60000;
    r.duration = load(r) || r.planned;
    r.el = document.createElement("div");
    r.el.className = "countdown";
    r.el.setAttribute("role", "timer");
    r.el.title = "Double-click to change";
    r.button = document.createElement("button");
    r.button.className = "round-start";
    r.button.type = "button";
    const h = s.querySelector("h2");
    h ? h.after(r.el, r.button) : s.append(r.el, r.button);
    r.el.addEventListener("dblclick", e => { e.preventDefault(); edit(r); });
    r.button.addEventListener("click", () => {
      r.end = r.end === null ? Date.now() + r.duration : null; // start, or reset
      r.button.blur(); // hand the keyboard back to reveal
      tick();
    });
    return r;
  });

  function edit(r) {
    if (r.input) return;
    const input = r.input = document.createElement("input");
    input.type = "text";
    input.className = "round-input";
    input.setAttribute("aria-label", "Round length");
    input.value = fmt(r.duration);
    function close(keep) {
      if (r.input !== input) return;
      r.input = null;
      const ms = parse(input.value);
      if (keep && ms > 0 && ms !== r.duration) {
        r.duration = ms;
        r.end = null; // ready to start at the new length
        save(r);
      }
      input.remove();
      r.el.hidden = false;
      tick();
    }
    input.addEventListener("keydown", e => {
      e.stopPropagation(); // keep reveal's shortcuts away from typing
      if (e.key === "Enter") close(true);
      if (e.key === "Escape") { e.preventDefault(); close(false); }
    });
    input.addEventListener("blur", () => close(true));
    r.el.hidden = true;
    r.el.after(input);
    input.focus();
    input.select();
  }

  function tick() {
    for (const r of rounds) {
      const left = r.end === null ? r.duration : r.end - Date.now();
      r.el.classList.toggle("done", left <= 0);
      const text = left > 0 ? fmt(left) : "Time's up!";
      if (r.el.textContent !== text) r.el.textContent = text;
      const label = r.end === null ? "▶ Start" : "↺ Reset";
      if (r.button.textContent !== label) r.button.textContent = label;
    }
  }
  if (rounds.length) { tick(); setInterval(tick, 250); }
})();
</script>
