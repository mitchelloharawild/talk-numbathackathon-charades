title: NUMBAT Slides
author: NUMBAT hackathon 2026
version: 0.1.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    revealjs:
      theme: [default, numbat.scss]
      css: numbat.css
      template-partials:
        - title-slide.html
      include-after-body:
        - countdown.html
        - sessions.html
      width: 1600
      height: 900
      margin: 0
      center: false
      slide-level: 2
      slide-number: c
      controls: false
      progress: false
      transition: fade
      transition-speed: fast
      background-transition: fade
      highlight-style: github
      code-line-numbers: false
      lang: en-AU
      date-format: "D MMMM YYYY"
      footer: "[NUMBAT [hackathon]{.yr}]{.wm} [numbat.space](https://numbat.space)"
