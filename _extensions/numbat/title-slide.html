<section id="$idprefix$title-slide" class="slide numbat-title $if(title-style)$$title-style$$else$light$endif$$if(photo)$ has-photo$endif$">
<i class="numbat-mark numbat-float" aria-hidden="true"></i>
<div class="lockup"><div><p class="wm">NUMBAT <span class="yr">hackathon</span></p><p class="org">Non-Uniform Monash Business Analytics Team</p></div></div>
<div class="title-main">
$if(kicker)$<p class="kick">$kicker$</p>$endif$
<h1 class="title">$title$</h1>
$if(subtitle)$<p class="subtitle">$subtitle$</p>$endif$
</div>
$if(photo)$<div class="hexphoto"><img src="$photo$" alt="$if(photo-alt)$$photo-alt$$endif$"></div>$endif$
<div class="title-foot"><div class="people">$for(by-author)$<p class="person"><b>$it.name.literal$</b>$for(it.affiliations)$<span>$it.name$</span>$endfor$</p>$endfor$</div>$if(date)$<p class="date">$date$</p>$endif$</div>
</section>
